project:
  type: website

website:
  title: "difmap_smartedit"
  description: "Wrapper Python pour Difmap — imagerie VLBI via API Python, interface PyQt6 et traitement batch."

  navbar:
    background: primary
    search: true
    left:
      - text: "v2.5.0"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/iimavne/DIFMAP
        aria-label: GitHub

  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Accueil"
        file: index.qmd

      # ── 1. DÉMARRAGE ─────────────────────────────────────────────
      - section: "Démarrage"
        contents:
          - text: "Installation"
            file: 01_installation.qmd
          - text: "Dépannage installation"
            file: troubleshooting_install.qmd
          - text: "Quick Start"
            file: 02_quick_start.qmd

      # ── 2. CHERCHEUR — API PYTHON ─────────────────────────────────
      - section: "Chercheur — API Python"
        contents:
          - text: "Concepts & conventions"
            file: concepts_conventions.qmd
          - text: "Recettes & Patterns API"
            file: 03_api_python.qmd
          - section: "Tutoriels A→Z"
            contents:
              - text: "Tutoriel 1 — Produire une Dirty Map"
                file: tutorials/01_dirty_map.qmd
              - text: "Tutoriel 2 — Flagging programmatique"
                file: tutorials/02_flagging_programmatique.qmd
              - text: "Tutoriel 3 — Traitement batch (processus)"
                file: tutorials/03_batch_pipeline.qmd

      # ── 3. UTILISATEUR — GUI ──────────────────────────────────────
      - section: "Utilisateur — Interface graphique"
        contents:
          - text: "Interface graphique (PyQt6)"
            file: 04_interface_gui.qmd
          - text: "Workflows GUI"
            file: gui_workflows.qmd
          - text: "Dépannage GUI"
            file: troubleshooting_gui.qmd
          - text: "Traitement batch parallèle"
            file: 05_batch.qmd

      # ── 4. RÉFÉRENCE API (auto-générée depuis les docstrings) ─────
      # Les pages individuelles (session.DifmapSession.qmd, etc.)
      # sont générées par :  quartodoc build --config docs/_quarto.yml
      # Elles n'existent pas tant que cette commande n'a pas été lancée.
      - section: "Référence API"
        contents:
          - auto: reference/  

      # ── 5. DÉVELOPPEUR ────────────────────────────────────────────
      - section: "Développeur"
        contents:
          - text: "Contexte et existant"
            file: 06_contexte.qmd
          - text: "Architecture du wrapper"
            file: 07_architecture.qmd
          - text: "Implémentation technique"
            file: 08_implementation.qmd
          - text: "Contribuer"
            file: 09_contribuer.qmd
          - text: "Build / tests / génération doc"
            file: doc_build_release.qmd

      # ── 6. LIMITATIONS ────────────────────────────────────────────
      - section: "Limitations"
        contents:
          - text: "Limitations connues"
            file: known_limitations.qmd

  page-footer:
    left: "difmap_smartedit v2.5.0 — wrapper Python pour Difmap (Caltech)"
    right:
      - icon: github
        href: https://github.com/iimavne/DIFMAP

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    highlight-style: github

# ── QUARTODOC ─
quartodoc:
  package: difmap_wrapper
  dir: reference
  parser: numpy
  dynamic: false
  sections:
    - title: "Session et cycle de vie"
      desc: "Gestion de l'environnement et du cycle de vie du moteur C."
      contents:
        - DifmapSession       # <-- Modifié (sans le session.)

    - title: "Données UV — Observation"
      desc: "Sélection, extraction et flagging des visibilités."
      contents:
        - Observation         # <-- Modifié

    - title: "Imagerie — DifmapImager"
      desc: "Grille d'image, pondération UV et transformée de Fourier inverse."
      contents:
        - DifmapImager        # <-- Modifié

    - title: "Visualisation — Visualizer"
      desc: "Graphiques statiques Matplotlib."
      contents:
        - Visualizer          # <-- Modifié

    - title: "Traitement parallèle"
      desc: "Traitement batch sur processus OS séparés."
      contents:
        - DifmapBatchManager  # <-- Modifié

    - title: "Exceptions"
      desc: "Hiérarchie d'exceptions du wrapper."
      contents:
        - DifmapError         # <-- Modifié
        - DifmapStateError    # <-- Modifié
